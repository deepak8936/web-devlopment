<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image,list,table
    </title>
</head>

<body>
    <h1>Image</h1>
    <img height=150 width="220" src="dad-909510__480.jpg" alt="walk">

    <!--List-->
    <!--ul is a unorder list-->
    <h1>student</h1>
    <ul>
        <li> deepak</li>
        <li>rahul</li>
        <li>aman</li>
        <li>raushan</li>
    </ul>
    <!--ol is a unorder list-->
    <ol type="1">
        <li>deepak</li>
        <li>rahul</li>
        <li>aman</li>
        <li>raushan</li>
    </ol>

    <!--table-->
    <h1>table</h1>
    <table border="1">
        <tr>
            <th>name</th>
            <th>age</th>
            <th>school</th>
            <th colspan="3">Role</th>
        </tr>

        <tr>
            <td>deepak</td>
            <td>21</td>
            <td>dps</td>
            <td>java developer</td>
            <td>python devloper </td>
            <td>html,css,js</td>

        </tr>
        <tr>
            <td>rahul</td>
            <td>22</td>
            <td>dps</td>
            <td>python devloper</td>
            <td>mern stack</td>
            <td>ai buider</td>
        </tr>
    </table>
</body>

</html>
