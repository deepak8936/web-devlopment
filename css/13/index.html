<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="box">
        <h1>Sign Up</h1>
        <div><label for="first"> First Name</label>
            <input id="first" type="text" placeholder="Enter Your Name">
        </div>
        <div>
            <label for="second">
                Last Name
            </label>
            <input id="second" type="text" placeholder="Enter Your Last Name">
        </div>
        <div>
            <label for="mobile">Mobile Number</label>
            <input id="mobile" type="tel" placeholder="Enter Your 10 Digit number">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Your Email">
        </div>
        <button type="submit">Sign Up</button>


</body>

</html>
